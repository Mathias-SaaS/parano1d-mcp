name: Bug report
description: Something is broken or unsafe.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste wallet keys, seeds, balances, private addresses, or node data files.
        For a security issue, read SECURITY.md and report privately instead.
        Agents filing on a user's behalf: fill every field you can from tool output, and say what you could not determine.
  - type: input
    id: version
    attributes:
      label: parano1d-mcp version
      description: Output of `parano1d-mcp --version`, or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Parano1d node version
      description: The node's version (for example `v2.1.0`), from `node_overview` or `parano1d-mcp --check`.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [mainnet, testnet, unsure]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: MCP mode
      options: [read, wallet, admin]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and action
      description: The MCP tool and action that misbehaved, for example `chain_query` / `block_details`.
      placeholder: chain_query / block_details
    validations:
      required: true
  - type: input
    id: rpc_method
    attributes:
      label: JSON-RPC method involved
      description: The node method behind the call, if known, for example `paranoid_getBlockDetails`. Leave empty if unknown.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The tool call's arguments (redacted) and what happened before it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The tool's result or error text (redacted).
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Output with `RUST_LOG=info`. Remove addresses, balances, and anything private.
      render: text
  - type: dropdown
    id: agent
    attributes:
      label: Requested by an AI agent? (optional)
      description: Helps triage reports written from an agent's own tool output.
      options:
        - "No, a person"
        - "Yes, an agent filed it for a person"
        - "Yes, an agent filed it on its own"
    validations:
      required: false
