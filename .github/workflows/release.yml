name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Build provenance: the OIDC token signs an attestation that binds the
    # archive to this workflow, commit and runner.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A release build must not write a cache a later release trusts:
          # read only, so a poisoned cache entry cannot be planted here.
          lookup-only: true
      - name: Install cargo-auditable
        shell: bash
        run: cargo install --locked cargo-auditable --version 0.7.7
      # cargo-auditable embeds the dependency list in the binary, so
      # `cargo audit bin <asset>` audits exactly what shipped. The path remap
      # keeps the build user and the local registry layout out of the binary.
      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          # In Git Bash on Windows $HOME is /c/Users/... while rustc sees
          # C:\Users\..., so add the native form when cygpath exists.
          if command -v cygpath >/dev/null 2>&1; then
            native_cargo="$(cygpath -w "${CARGO_HOME:-$HOME/.cargo}")"
            export RUSTFLAGS="$RUSTFLAGS --remap-path-prefix=$native_cargo=/cargo"
          fi
          cargo auditable build --release --locked
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $tag"
            exit 1
          fi
          mkdir -p dist
          cp target/release/parano1d-mcp dist/
          cp README.md LICENSE dist/
          archive="parano1d-mcp-${tag}-${{ matrix.label }}.tar.gz"
          tar -czf "$archive" -C dist .
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9A-Za-z._-]+$') { throw "invalid release tag: $tag" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/parano1d-mcp.exe dist/
          Copy-Item README.md, LICENSE dist/
          $archive = "parano1d-mcp-$tag-windows-x86_64.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            "$archive.sha256",
            "$hash  $archive`n",
            [System.Text.Encoding]::ASCII
          )
      # Verifiable with: gh attestation verify <archive> --repo <owner>/<repo>
      # Attestations are not available for user-owned private repositories, so
      # the step is skipped there and runs automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "parano1d-mcp-*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: |
            parano1d-mcp-*.tar.gz
            parano1d-mcp-*.zip
            parano1d-mcp-*.sha256
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9A-Za-z._-]*) ;;
            *) echo "invalid release tag: $TAG"; exit 1 ;;
          esac
          (
            cd dist
            cat ./*.sha256 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; uploading to it"
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "parano1d-mcp $TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" ./dist/* --clobber
