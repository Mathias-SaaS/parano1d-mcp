name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Build provenance: the OIDC token signs an attestation that binds the
    # archive to this workflow, commit and runner.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A release build must not write a cache a later release trusts:
          # read only, so a poisoned cache entry cannot be planted here.
          lookup-only: true
      - name: Install cargo-auditable
        shell: bash
        run: cargo install --locked cargo-auditable --version 0.7.7
      # cargo-auditable embeds the dependency list in the binary, so
      # `cargo audit bin <asset>` audits exactly what shipped. The path remap
      # keeps the build user and the local registry layout out of the binary.
      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          # In Git Bash on Windows $HOME is /c/Users/... while rustc sees
          # C:\Users\..., so add the native form when cygpath exists.
          if command -v cygpath >/dev/null 2>&1; then
            native_cargo="$(cygpath -w "${CARGO_HOME:-$HOME/.cargo}")"
            export RUSTFLAGS="$RUSTFLAGS --remap-path-prefix=$native_cargo=/cargo"
          fi
          cargo auditable build --release --locked
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "invalid release tag: $tag"
            exit 1
          fi
          mkdir -p dist
          cp target/release/parano1d-mcp dist/
          cp README.md LICENSE dist/
          archive="parano1d-mcp-${tag}-${{ matrix.label }}.tar.gz"
          tar -czf "$archive" -C dist .
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9A-Za-z._-]+$') { throw "invalid release tag: $tag" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/parano1d-mcp.exe dist/
          Copy-Item README.md, LICENSE dist/
          $archive = "parano1d-mcp-$tag-windows-x86_64.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            "$archive.sha256",
            "$hash  $archive`n",
            [System.Text.Encoding]::ASCII
          )
      # Verifiable with: gh attestation verify <archive> --repo <owner>/<repo>
      # Attestations are not available for user-owned private repositories, so
      # the step is skipped there and runs automatically once the repo is public.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "parano1d-mcp-*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: |
            parano1d-mcp-*.tar.gz
            parano1d-mcp-*.zip
            parano1d-mcp-*.sha256
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9A-Za-z._-]*) ;;
            *) echo "invalid release tag: $TAG"; exit 1 ;;
          esac
          (
            cd dist
            cat ./*.sha256 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; uploading to it"
          else
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "parano1d-mcp $TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" ./dist/* --clobber

  # Publishing runs only for a release tag, after the attested build and the
  # draft release above. Both jobs use the `release` environment: give it the
  # maintainer as a required reviewer and limit it to `v*` tags, so nothing
  # reaches crates.io or the MCP Registry until the draft has been checked.
  crates-io:
    name: publish (crates.io)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    # Trusted publishing: the OIDC token is exchanged for a short-lived
    # crates.io token, which the action revokes when the job ends.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show
      - name: Check the tag matches Cargo.toml and server.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          crate="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "parano1d-mcp") | .version')"
          server="$(jq -r '.version' server.json)"
          package="$(jq -r '.packages[] | select(.registryType == "cargo") | .version' server.json)"
          echo "tag $version, Cargo.toml $crate, server.json $server / $package"
          [ "$crate" = "$version" ] && [ "$server" = "$version" ] && [ "$package" = "$version" ]
      # The very first publish of a crate cannot use trusted publishing: the
      # crate must already exist on crates.io before a trusted publisher can
      # be configured for it. 0.1.4 is therefore published once by hand with a
      # publish-new token, which is revoked afterwards; this step then finds
      # the version already there and the job skips the upload.
      - name: Is this version already on crates.io?
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          index="$(curl --fail --silent --show-error --location \
            https://index.crates.io/pa/ra/parano1d-mcp || true)"
          if printf '%s\n' "$index" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null 2>&1; then
            echo "parano1d-mcp $version is already on crates.io; skipping the upload"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to crates.io
        if: steps.published.outputs.done != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        if: steps.published.outputs.done != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  mcp-registry:
    name: publish (MCP Registry)
    needs: crates-io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    # GitHub OIDC proves the workflow runs in the noidium organisation, which
    # grants the io.github.noidium/* namespace.
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      # SHA-256 of mcp-publisher_linux_amd64.tar.gz from that release (equal to
      # its registry_1.8.7_checksums.txt entry). Update both lines together.
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive"
          ./mcp-publisher --version || true
      - name: Check server.json matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [ "$(jq -r '.version' server.json)" = "$version" ]
          [ "$(jq -r '.packages[] | select(.registryType == "cargo") | .version' server.json)" = "$version" ]
      # The registry checks ownership by finding `mcp-name: <name>` in the
      # README crates.io renders; wait until that version's README is served.
      - name: Wait for the crates.io README
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="$(jq -r '.name' server.json)"
          for _ in $(seq 1 30); do
            url="$(curl --fail --silent --show-error -H 'Accept: application/json' \
              "https://crates.io/api/v1/crates/parano1d-mcp/$version/readme" | jq -r '.url // empty' || true)"
            if [ -n "$url" ] && curl --fail --silent --show-error "$url" | grep -qF "mcp-name: $name"; then
              echo "README for $version carries mcp-name: $name"
              exit 0
            fi
            sleep 10
          done
          echo "the crates.io README for $version does not show mcp-name: $name"
          exit 1
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
