[package]
name = "parano1d-mcp"
version = "0.1.5"
edition = "2024"
rust-version = "1.96"
description = "MCP server for a local Parano1d node"
license = "Apache-2.0"
repository = "https://github.com/noidium/parano1d-mcp"
homepage = "https://github.com/noidium/parano1d-mcp"
documentation = "https://docs.rs/parano1d-mcp"
readme = "README.md"
keywords = ["mcp", "parano1d", "blockchain", "json-rpc", "ai-agent"]
categories = ["command-line-utilities", "api-bindings"]
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
# The money paths use checked arithmetic; this makes any missed overflow panic
# in release instead of wrapping silently.
overflow-checks = true
